# Camera TF Publisher Configuration
# Publishes static transform from robot base to camera frame

camera_tf_publisher:
  ros__parameters:
    # Parent frame (robot base)
    parent_frame: "base"
    
    # Camera frame ID (must match vision_config.yaml)
    camera_frame: "Camera"
    
    # Camera position relative to base (meters)
    # From Isaac Sim: Camera is at world [0.2, 0.0, 2.3]
    # Robot base is at world [0.0, 0.0, 0.0]
    # So camera relative to base is [0.2, 0.0, 2.3]
    camera_x: 0.2
    camera_y: 0.0
    camera_z: 2.3
    
    # Camera orientation (radians)
    # Isaac Sim shows Z=180° = π radians yaw (camera facing backward)
    camera_roll: 0.0
    camera_pitch: 0.0
    camera_yaw: 3.14159265359  # 180 degrees
